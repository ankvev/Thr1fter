{% extends "layout.html" %}
{% block body %}

<!-- About page – visible without login -->
<div class="thr-hero d-flex align-items-center justify-content-center py-5">
  <div class="container text-center px-3" style="max-width: 700px;">
    <h1 class="fw-bold thr-hero-title mb-3">About Thr1fter</h1>
    <p class="fs-5 thr-hero-subtitle mb-4">
      Thr1fter is a community-driven map of thrift stores across Australia.
      Discover hidden gems, save your favourites, and share stores with fellow thrifters.
    </p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{{ url_for('login') }}" class="btn thr-btn-primary btn-lg px-5">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </a>
      <a href="{{ url_for('register') }}" class="btn thr-btn-outline btn-lg px-5">
        <i class="bi bi-person-plus me-2"></i>Register
      </a>
    </div>
  </div>
</div>

{% endblock %}
