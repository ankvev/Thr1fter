{% extends "layout.html" %}
{% block body %}

<div class="thr-auth-wrapper d-flex align-items-center justify-content-center py-5">
  <div class="thr-auth-card card shadow-sm p-4 p-md-5">

    <div class="text-center mb-4">
      <h1 class="thr-brand fs-2 fw-bold">Thr1fter</h1>
      <p class="text-muted">Welcome back – sign in to continue</p>
    </div>

    <form method="POST" novalidate>

      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text thr-input-icon"><i class="bi bi-person"></i></span>
          <input type="text" id="username" name="username"
                 class="form-control" placeholder="Your username" required autofocus>
        </div>
      </div>

      <!-- Password with show/hide toggle -->
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text thr-input-icon"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" name="password"
                 class="form-control" placeholder="Your password" required>
          <button type="button" class="btn thr-btn-eye"
                  onclick="togglePassword('password', 'pwd-icon')" aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="pwd-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn thr-btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center mb-0 text-muted">
      Don't have an account?
      <a href="{{ url_for('register') }}" class="thr-link fw-semibold">Register here</a>
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='login.js') }}"></script>
{% endblock %}
