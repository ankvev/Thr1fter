{% extends "layout.html" %}
{% block body %}

<!-- Hero landing page – shown to unauthenticated visitors -->
<div class="thr-hero d-flex align-items-center justify-content-center">
  <div class="text-center px-3">
    <h1 class="thr-hero-title display-3 fw-bold mb-3">Thr1fter</h1>
    <p class="thr-hero-subtitle fs-5 mb-5">
      Discover the best thrift stores near you across Australia.
    </p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{{ url_for('login') }}" class="btn thr-btn-primary btn-lg px-5">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </a>
      <a href="{{ url_for('register') }}" class="btn thr-btn-outline btn-lg px-5">
        <i class="bi bi-person-plus me-2"></i>Register
      </a>
    </div>
    <div class="mt-4">
      <a href="{{ url_for('about') }}" class="thr-link">Learn more about Thr1fter</a>
    </div>
  </div>
</div>

{% endblock %}
