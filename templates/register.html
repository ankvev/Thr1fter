{% extends "layout.html" %}

{% block body %}
    <h1>Register</h1>
    
    <form method="POST" id="registerForm" onsubmit="return validateForm()">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <div class="error-message" id="usernameError"></div>
        </div>
        
        <div>
            <label for="email">Email (optional):</label>
            <input type="email" id="email" name="email">
        </div>
        
        <div class="input-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="button" onclick="togglePassword('password', 'password-icon')">
                <i class="bi bi-eye" id="password-icon"></i>
            </button>
            <div class="error-message" id="passwordError"></div>
        </div>
        
        <div class="input-group">
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
            <button type="button" onclick="togglePassword('confirm_password', 'password-icon')">
                <i class="bi bi-eye" id="password-icon"></i>
            </button>
            <div class="error-message" id="confirmPasswordError"></div>
        </div>
        
        <button type="submit">Register</button>
    </form>
    
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>

    <script src="{{ url_for('static', filename='register.js') }}"></script>

{% endblock %}
